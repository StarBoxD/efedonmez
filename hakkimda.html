<!DOCTYPE html>
<html lang="tr">
<head>

  <link rel="manifest" href="site.webmanifest" />
  <title>Hakkımda — Efe Dönmez | efedonmez.com</title>

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192x192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />

  <!-- Fonts & Stiller (< 200 satır kuralına uygun ayrık CSS'ler) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />

<body>
  <div class="scroll-progress-bar" id="scroll-progress"></div>

  <!-- Ambient Background Bileşeni -->
  <canvas id="bg-particles" aria-hidden="true"></canvas>
  <div class="ambient-bg" aria-hidden="true">
    <div class="cyber-grid"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="glow-orb glow-orb-3"></div>
    <div class="glow-orb glow-orb-4"></div>
  </div>
  <div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>

  <!-- Üst Navigasyon Bileşeni -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="brand-btn" aria-label="Ana Sayfa">
        <span class="brand-dot"></span>Efe<span class="accent">Dönmez</span>
      </a>
      <nav class="nav-tabs">
        <a href="index.html" class="tab-btn" id="nav-home"><span>✦</span> Ana Sayfa</a>
        <a href="hakkimda.html" class="tab-btn active" id="nav-about"><span>✦</span> Hakkımda</a>
        <button onclick="openQrModal()" class="tab-btn qr-trigger-btn" title="Dijital Kartvizit & QR" aria-label="Dijital Kartvizit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <section id="view-about" class="fade-in">
      <div class="about-header">
        <a href="index.html" class="back-link">← Ana Sayfaya Dön</a>
        <h1 class="shimmer-title" style="font-size: clamp(1.8rem, 4vw, 2.4rem);">Hakkımda</h1>
        <div class="about-filters">
          <button class="filter-pill active" onclick="filterAboutCards('all', this)">Tümü (36)</button>
          <button class="filter-pill" onclick="filterAboutCards('kisisel', this)">Kişisel</button>
          <button class="filter-pill" onclick="filterAboutCards('zevkler', this)">Zevkler & Yemek</button>
          <button class="filter-pill" onclick="filterAboutCards('oyunmuzik', this)">Oyun & Müzik</button>
          <button class="filter-pill" onclick="filterAboutCards('karakter', this)">Karakter & Rutin</button>
        </div>
      </div>

      <!-- Kişisel Favoriler Bileşen Izgarası (Her Kategoriden 1 Seçim - data/about.js) -->
      <div class="personal-grid" id="favorites-container"></div>
    </section>
  </main>

  <footer>
    <div class="footer-inner">
      <span>© 2026 Efe Dönmez • efedonmez.com</span>
      <span>Tüm hakları saklıdır</span>
    </div>

  <!-- Modüler JS Bileşenleri (< 200 Satır Kuralına Uygun) -->
  <script src="js/confetti.js"></script>
  <script src="js/particles.js"></script>
  <script src="data/about.js"></script>
  <script src="js/components.js"></script>
